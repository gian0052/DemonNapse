[package]
name = "demonnapse"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lightweight companion daemon for Razer Synapse: one Chroma Studio effect per on-board profile"

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
