name: Device support request
description: The check command stops with an error or does not find your Razer mouse or keyboard.
title: "[Device support] "
labels: ["device support"]
body:
  - type: markdown
    attributes:
      value: |
        DemonNapse is verified on the Razer Basilisk V3 35K (wired) only. Other Razer mice, wired or
        through their wireless dongle, should work but have not been tried yet; keyboards are not driven yet,
        but `check` can test one. For a Razer mouse or keyboard that `check` cannot handle, fill this in: the more of it you can provide, the
        more likely the model gets added.
  - type: input
    id: model
    attributes:
      label: Mouse model
      placeholder: Razer Naga Pro (wireless, through its dongle)
    validations:
      required: true
  - type: input
    id: pid
    attributes:
      label: USB product id
      description: '"demonnapse.exe check" lists the connected Razer devices with their PID; Device Manager shows it too (VID_1532&PID_xxxx).'
      placeholder: "0x0090"
  - type: input
    id: version
    attributes:
      label: DemonNapse version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: Report of "demonnapse.exe check" (demonnapse-check-XXXX.txt), up to where it stops
      render: text
    validations:
      required: true
  - type: dropdown
    id: synapse
    attributes:
      label: Does Synapse 4 show Chroma Studio effects and on-board profiles for this mouse?
      options:
        - "Yes, both"
        - "Chroma Studio only"
        - "On-board profiles only"
        - "Neither"
        - "I do not use Synapse 4"
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Can you help test?
      options:
        - label: I own this mouse and can run a test build and report back
  - type: textarea
    id: notes
    attributes:
      label: Anything else
